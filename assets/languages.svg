<svg xmlns="http://www.w3.org/2000/svg" width="440" height="330" viewBox="0 0 440 330" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f7bf5"/><stop offset=".5" stop-color="#904e95"/><stop offset="1" stop-color="#e05397"/></linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7bf5" stop-opacity=".9"/><stop offset=".5" stop-color="#904e95" stop-opacity=".5"/><stop offset="1" stop-color="#e05397" stop-opacity=".9"/></linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9b8ff"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#fff" fill-opacity=".06"/></pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="clip"><rect x="1" y="1" width="438" height="328" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    .up { opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .glow { animation: glow 8s ease-in-out infinite alternate; }
    @keyframes glow { to { transform: translate(-160px, 60px); } }
    
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    
  </style>
  <g clip-path="url(#clip)">
    <rect width="440" height="330" fill="#0d1117"/>
    <rect width="440" height="330" fill="url(#dots)"/>
    <g filter="url(#blur)" opacity=".3"><circle class="glow" cx="380" cy="40" r="90" fill="#904e95"/></g>
    <g class="fade"><rect x="22" y="23" width="4" height="26" rx="2" fill="url(#brand)"/><text x="36" y="44" fill="#e6edf3" font-size="21" font-weight="700">Top Languages</text><text x="36" y="65" fill="#8b949e" font-size="12.5">By code size across my repositories</text></g><clipPath id="barclip"><rect x="22" y="82" width="396" height="10" rx="5"/></clipPath><g clip-path="url(#barclip)"><rect x="22" y="82" width="396" height="10" fill="#21262d"/><rect x="22" y="82" width="396" height="10" fill="#30363d"/></g><text x="220.0" y="200" text-anchor="middle" fill="#8b949e" font-size="14">Generating… run the workflow</text>
  </g>
  <rect x="1" y="1" width="438" height="328" rx="18" stroke="url(#border)" stroke-width="1.5"/>
</svg>
