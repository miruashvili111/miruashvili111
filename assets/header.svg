<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bf5"/><stop offset=".5" stop-color="#904e95"/><stop offset="1" stop-color="#e05397"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bf5" stop-opacity=".9"/><stop offset=".5" stop-color="#904e95" stop-opacity=".5"/><stop offset="1" stop-color="#e05397" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity=".06"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#7cb4ff"/><stop offset=".33" stop-color="#c58bd0"/>
      <stop offset=".66" stop-color="#e05397"/><stop offset="1" stop-color="#7cb4ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine2" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#7cb4ff"/><stop offset=".33" stop-color="#c58bd0"/>
      <stop offset=".66" stop-color="#e05397"/><stop offset="1" stop-color="#7cb4ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    
    <clipPath id="cardclip"><rect x="1" y="1" width="898" height="328" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    
    .role { opacity: 0; animation: role 15.0s ease-in-out infinite; transform-box: fill-box; }
    @keyframes role {
      0% { opacity: 0; transform: translateY(14px); }
      2.40% { opacity: 1; transform: translateY(0); }
      17.00% { opacity: 1; transform: translateY(0); }
      20.00% { opacity: 0; transform: translateY(-14px); }
      100% { opacity: 0; transform: translateY(-14px); }
    }
    .orb1 { animation: o1 14s ease-in-out infinite alternate; }
    .orb2 { animation: o2 17s ease-in-out infinite alternate; }
    .orb3 { animation: o3 12s ease-in-out infinite alternate; }
    @keyframes o1 { to { transform: translate(260px, 60px); } }
    @keyframes o2 { to { transform: translate(-280px, -40px); } }
    @keyframes o3 { to { transform: translate(120px, -70px); } }
    .fadeup { opacity: 0; animation: fadeup 1s ease-out forwards; }
    @keyframes fadeup { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .floaty { animation: floaty 6s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    
  </style>
  <g clip-path="url(#cardclip)">
    <rect width="900" height="330" fill="#0d1117"/>
    <rect width="900" height="330" fill="url(#dots)"/>
    
    <g filter="url(#blur)" opacity=".55">
      <circle class="orb1" cx="170" cy="90" r="120" fill="#004e95"/>
      <circle class="orb2" cx="720" cy="250" r="130" fill="#e05397" fill-opacity=".7"/>
      <circle class="orb3" cx="450" cy="300" r="110" fill="#904e95"/>
    </g>
    <g class="floaty" opacity=".25">
      <text x="70" y="270" class="mono" font-size="40" fill="#7cb4ff">&lt;/&gt;</text>
      <text x="780" y="95" class="mono" font-size="38" fill="#e05397">{ }</text>
    </g>

    <g class="fadeup" style="animation-delay:.1s">
      <rect x="318.0" y="40" width="264" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <circle class="pulse" cx="340.0" cy="56" r="5" fill="#3fb950"/>
      <circle cx="340.0" cy="56" r="5" fill="#3fb950"/>
      <text x="458.0" y="61" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="600">Building web &amp; mobile apps</text>
    </g>

    <g class="fadeup" style="animation-delay:.35s">
      <text x="450.0" y="112" text-anchor="middle" fill="#8b949e" font-size="20" font-weight="500">Hi there, I'm</text>
    </g>
    <g class="fadeup" style="animation-delay:.55s">
      <text x="450.0" y="178" text-anchor="middle" font-size="62" font-weight="800" letter-spacing="-1">
        <tspan fill="url(#shine)">Giorgi Miruashvili</tspan>
      </text>
    </g>

    
    <g class="fadeup" style="animation-delay:.9s"><text class="role mono" style="animation-delay:0.0s" x="450.0" y="236" text-anchor="middle" fill="#c9d1d9" font-size="21" font-weight="500">Full-Stack Developer</text>
<text class="role mono" style="animation-delay:3.0s" x="450.0" y="236" text-anchor="middle" fill="#c9d1d9" font-size="21" font-weight="500">React · Next.js · React Native</text>
<text class="role mono" style="animation-delay:6.0s" x="450.0" y="236" text-anchor="middle" fill="#c9d1d9" font-size="21" font-weight="500">Node.js · NestJS · PostgreSQL</text>
<text class="role mono" style="animation-delay:9.0s" x="450.0" y="236" text-anchor="middle" fill="#c9d1d9" font-size="21" font-weight="500">Docker · Kubernetes · AWS</text>
<text class="role mono" style="animation-delay:12.0s" x="450.0" y="236" text-anchor="middle" fill="#c9d1d9" font-size="21" font-weight="500">Shipping faster with AI &amp; Claude Code</text></g>

    <g transform="translate(410.0 270)"><g class="fadeup" style="animation-delay:1.2s">
      <path transform="translate(0 4) scale(1)" fill="#8b949e" d="m12.596 11.596-3.535 3.536a1.5 1.5 0 0 1-2.122 0l-3.535-3.536a6.5 6.5 0 1 1 9.192-9.193 6.5 6.5 0 0 1 0 9.193Zm-1.06-8.132v-.001a5 5 0 1 0-7.072 7.072L8 14.07l3.536-3.534a5 5 0 0 0 0-7.072ZM8 9a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 9Z"/>
      <text x="22" y="17" fill="#8b949e" font-size="15" font-weight="500">Georgia</text>
    </g></g>
    <rect x="0" y="326" width="900" height="4" fill="url(#shine2)"/>
    
  </g>
  <rect x="1" y="1" width="898" height="328" rx="18" stroke="url(#border)" stroke-width="1.5"/>
</svg>
