<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bf5"/><stop offset=".5" stop-color="#904e95"/><stop offset="1" stop-color="#e05397"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bf5" stop-opacity=".9"/><stop offset=".5" stop-color="#904e95" stop-opacity=".5"/><stop offset="1" stop-color="#e05397" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity=".06"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#004e95"/><stop offset=".5" stop-color="#904e95"/><stop offset="1" stop-color="#e05397"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="1" y="1" width="898" height="188" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    
    .w1 { animation: wv 9s linear infinite; }
    .w2 { animation: wv 6s linear infinite reverse; }
    .w3 { animation: wv 12s linear infinite; }
    @keyframes wv { from { transform: translateX(0); } to { transform: translateX(-450px); } }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.4s ease-in-out infinite; }
    @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }
    
  </style>
  <g clip-path="url(#cardclip)">
    <rect width="900" height="190" fill="#0d1117"/>
    <rect width="900" height="190" fill="url(#dots)"/>
    
    <g opacity=".35" class="w3"><path d="M0 120 q 112.5 -18 225.0 0 t 225.0 0 q 112.5 -18 225.0 0 t 225.0 0 q 112.5 -18 225.0 0 t 225.0 0 q 112.5 -18 225.0 0 t 225.0 0 q 112.5 -18 225.0 0 t 225.0 0 q 112.5 -18 225.0 0 t 225.0 0 q 112.5 -18 225.0 0 t 225.0 0 q 112.5 -18 225.0 0 t 225.0 0 V 190 H 0 Z" fill="url(#wg)"/></g>
    <g opacity=".55" class="w2"><path d="M0 138 q 112.5 -14 225.0 0 t 225.0 0 q 112.5 -14 225.0 0 t 225.0 0 q 112.5 -14 225.0 0 t 225.0 0 q 112.5 -14 225.0 0 t 225.0 0 q 112.5 -14 225.0 0 t 225.0 0 q 112.5 -14 225.0 0 t 225.0 0 q 112.5 -14 225.0 0 t 225.0 0 q 112.5 -14 225.0 0 t 225.0 0 V 190 H 0 Z" fill="url(#wg)"/></g>
    <g opacity=".9" class="w1"><path d="M0 156 q 112.5 -10 225.0 0 t 225.0 0 q 112.5 -10 225.0 0 t 225.0 0 q 112.5 -10 225.0 0 t 225.0 0 q 112.5 -10 225.0 0 t 225.0 0 q 112.5 -10 225.0 0 t 225.0 0 q 112.5 -10 225.0 0 t 225.0 0 q 112.5 -10 225.0 0 t 225.0 0 q 112.5 -10 225.0 0 t 225.0 0 V 190 H 0 Z" fill="url(#wg)"/></g>
    <g transform="translate(438.0 18)"><path class="beat" d="M12 21s-7.5-4.6-10-9.3C.4 8.5 2.2 4.5 6 4.5c2.2 0 3.6 1.3 4.5 2.6.3.4.9.4 1.2 0 .9-1.3 2.3-2.6 4.5-2.6 3.8 0 5.6 4 4 7.2C19.5 16.4 12 21 12 21Z" fill="#e05397"/></g>
    <text x="450.0" y="72" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">Thanks for stopping by!</text>
    <text x="450.0" y="97" text-anchor="middle" fill="#8b949e" font-size="14">Let's build something great together</text>
    
  </g>
  <rect x="1" y="1" width="898" height="188" rx="18" stroke="url(#border)" stroke-width="1.5"/>
</svg>
